name: Linux standalone release

on:
  workflow_dispatch:
  push:
    branches: [feat/zaban-user-ai-settings]

permissions:
  contents: read

jobs:
  build-and-package:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build standalone
        run: npm run build

      - name: Validate standalone in place
        run: npm run test:standalone

      - name: Prepare isolated standalone directory
        shell: bash
        run: |
          set -euo pipefail
          isolated="$RUNNER_TEMP/zaban-standalone-$GITHUB_RUN_ID"
          rm -rf "$isolated"
          mkdir -p "$isolated"
          echo "STANDALONE_ISOLATED_DIR=$isolated" >> "$GITHUB_ENV"

      - name: Copy standalone to isolated directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .next/standalone/.next/cache
          tar -C .next/standalone -cf - . | tar -C "$STANDALONE_ISOLATED_DIR" -xf -

      - name: Check isolated artifact boundaries
        shell: bash
        run: |
          set -euo pipefail
          test -f "$STANDALONE_ISOLATED_DIR/server.js"
          test -d "$STANDALONE_ISOLATED_DIR/.next/static"
          test ! -d "$STANDALONE_ISOLATED_DIR/.next/cache"
          test ! -e "$STANDALONE_ISOLATED_DIR/.env"
          test ! -e "$STANDALONE_ISOLATED_DIR/.env.local"
          test ! -e "$STANDALONE_ISOLATED_DIR/.env.production"
          test -f "$STANDALONE_ISOLATED_DIR/release-manifest.json"

      - name: Validate mysql2 imports from isolated directory
        shell: bash
        run: |
          set -euo pipefail
          STANDALONE_TEST_DIR="$STANDALONE_ISOLATED_DIR" STANDALONE_IMPORT_ONLY="1" STANDALONE_IMPORT_TARGET="mysql2/promise" NODE_PATH="" node scripts/test-standalone.mjs

      - name: Validate safer-buffer imports from isolated directory
        shell: bash
        run: |
          set -euo pipefail
          STANDALONE_TEST_DIR="$STANDALONE_ISOLATED_DIR" STANDALONE_IMPORT_ONLY="1" STANDALONE_IMPORT_TARGET="safer-buffer" NODE_PATH="" node scripts/test-standalone.mjs

      - name: Validate Better Auth and Drizzle imports from isolated directory
        shell: bash
        run: |
          set -euo pipefail
          STANDALONE_TEST_DIR="$STANDALONE_ISOLATED_DIR" STANDALONE_IMPORT_ONLY="1" STANDALONE_IMPORT_TARGET="better-auth" NODE_PATH="" node scripts/test-standalone.mjs
          STANDALONE_TEST_DIR="$STANDALONE_ISOLATED_DIR" STANDALONE_IMPORT_ONLY="1" STANDALONE_IMPORT_TARGET="drizzle-orm/mysql2" NODE_PATH="" node scripts/test-standalone.mjs

      - name: Validate Sharp imports from isolated directory
        shell: bash
        run: |
          set -euo pipefail
          STANDALONE_TEST_DIR="$STANDALONE_ISOLATED_DIR" STANDALONE_IMPORT_ONLY="1" STANDALONE_IMPORT_TARGET="sharp" NODE_PATH="" node scripts/test-standalone.mjs

      - name: Package release artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          secret_file="$(find .next/standalone -type f \( -name '.env' -o -name '.env.*' -o -iname '*.pem' -o -iname '*.key' \) -print -quit)"
          if [ -n "$secret_file" ]; then echo "Secret-like file found: $secret_file"; exit 1; fi
          test ! -d .next/standalone/.next/cache
          tar -C .next/standalone -czf dist/zaban-standalone-${GITHUB_SHA}.tar.gz .
          sha256sum dist/zaban-standalone-${GITHUB_SHA}.tar.gz | tee dist/SHA256SUMS
          du -h dist/zaban-standalone-${GITHUB_SHA}.tar.gz | tee dist/SIZE

      - name: Publish build summary
        shell: bash
        run: |
          {
            echo '### Linux standalone artifact'
            echo
            echo '```text'
            cat dist/SIZE
            cat dist/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: zaban-standalone-${{ github.sha }}
          path: |
            dist/zaban-standalone-${{ github.sha }}.tar.gz
            dist/SHA256SUMS
            dist/SIZE
          if-no-files-found: error
          retention-days: 14
